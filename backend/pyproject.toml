[build-system]
# Dependency-free in-tree backend: the approved offline wheels carry no build tools.
requires = []
build-backend = "rcb_build"
backend-path = ["build_backend"]

[project]
name = "robot-companion-backend"
version = "0.1.0.dev10"
description = "Independent headless Robot Framework language and debug services"
# The supported runtime rows (robot_companion_backend.runtime.SUPPORTED): Python 3.11 with
# RF 7.3.2 and Python 3.13 with RF 7.5. Python 3.12 is not a verified row.
requires-python = ">=3.11,!=3.12.*,<3.14"
dependencies = [
    'robotframework==7.3.2; python_version == "3.11"',
    'robotframework==7.5; python_version == "3.13"',
    "debugpy==1.8.22",
]
readme = "README.md"
license = "MIT"

[project.optional-dependencies]
# Document formatting (textDocument/formatting) is advertised only when this is installed.
format = ["robotframework-robocop==9.1.0"]

[project.scripts]
robot-companion-backend = "robot_companion_backend.__main__:main"
